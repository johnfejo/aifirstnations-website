<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@page { size: 88.9mm 50.8mm; margin: 0; }
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b0a06;}
.card{
  width: 88.9mm; height: 50.8mm;
  background: linear-gradient(160deg, #111009 0%, #1e1b10 55%, #2a2010 100%);
  position: relative;
  font-family: 'DM Sans', 'Segoe UI', sans-serif;
  color: #ede5d4;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.card::before{
  content:'';
  position:absolute; top:0; left:0; right:0; height:1.2mm;
  background: linear-gradient(90deg, #c9a24a, #d9732e);
}
.wordmark{font-family:'Cormorant Garamond', Georgia, serif; font-size:9pt; letter-spacing:2px; color:#f8f3ea; font-weight:700; margin-bottom:0.6mm;}
.tagline{font-size:5pt; color:#c9a24a; font-style:italic; margin-bottom:3.2mm;}

.qr-box{background:#f8f3ea; padding:1.6mm; border-radius:1.2mm; margin-bottom:2.4mm;}
.qr-box img{width:20mm; height:20mm; display:block;}
.qr-label{font-size:4.6pt; letter-spacing:0.4px; text-transform:uppercase; color:#7aab82; margin-bottom:3mm;}

.pillars{display:flex; gap:2.5mm;}
.pillar{
  font-size:4.4pt; letter-spacing:0.4px; text-transform:uppercase;
  background:rgba(201,162,74,0.14); border:0.15mm solid rgba(201,162,74,0.35);
  color:#c9a24a; padding:1mm 2.6mm; border-radius:3mm;
}
</style>
</head>
<body>
<div class="card">
  <div class="wordmark">AI FIRST NATIONS</div>
  <div class="tagline">Building Indigenous-Led Environmental Resilience</div>
  <div class="qr-box"><img src="../images/capability/qr-code.png" alt="QR code"></div>
  <div class="qr-label">Scan for Capability Statement</div>
  <div class="pillars">
    <span class="pillar">Creation</span>
    <span class="pillar">Connection</span>
    <span class="pillar">Contribution</span>
  </div>
</div>
</body>
</html>
